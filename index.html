<h3>Web Diesign Class</h3>

  <p>I chose this web design class because I wanted to see if I still wanted to pursue graphic design or not. Plus, I also wanted to learn more about web design and how it operates.</p>

<h3>Origin</h3>

<p>I was born September 14, 2008 in Cleveland, Ohio. I was raised there most of my life. Growing up I had an artistic calling, but I usually saw it as just a hobby until I found out about graphic design my sophmore year of highschool. That's when I beleived it clicked to me that I might want to go into digital art and media.</p>

<h3>Conflict</h3>

<p>I interned under my high school's Head of Graphic Design for 2 years. But coming to college I still didn't know if that's exactly what I wanted to do, so like I said before I was put in exploratory. In my opinion I think I will most likely end college with some type of graphic design major, art just calls to me.</p>

<h3>Conclusion</h3>

<p>Im not sure what life has ahead for me, I just know that I am ready to experience college to the fullest and apply myself the best I can. I want to be a person that can dedicate herself to her work and also do what she loves at the same time. It is very important to me to have a work ethic like that. And I'm sure UC can help me find it.</p>
